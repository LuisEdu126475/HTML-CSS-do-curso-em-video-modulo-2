<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso de mais pseudocodigo</title>
    <style>
        /* Estilos para o corpo da página */
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #f80202;
            text-align: center;
        }
        a {
            color: #f80202;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: #031e66;
        }
        a:hover {
            color: #ff0000;
            text-decoration: underline;
        }
        a:active {
            color: #ffd000;
        }
        a:after{
            content: " (clique aqui)";
            text-decoration: none;
            font-weight: normal;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h1>Personalizando os LINKS</h1>
    <ul>
        <li><a href="#" target="_blank">Link 1</a></li>
        <li><a href="#" target="_blank">Link 2</a></li>
        <li><a href="#" target="_blank">Link 3</a></li>
    </ul>
</body>
</html>
