<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONTES COM O GOOGLE FONTES</title>
    <style>
    @font-face {
        font-family: 'Cloister Black';
        src: url('fonts/CloisterBlack.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        /* tipos de formatos
        opentype(otf)
        truetype(ttf) 
        embedded-opentype(emb)
        truetype-aat(apple advanced typography)
        svg*/
    }
    body{
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: black;
    }
    h1{
        font-family: 'Cloister Black', serif;
        font-size: 3em;
        
    }
        </style>
</head>
<body>
       <H1>Titulo</H1>
       <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Soluta tenetur ipsa, culpa ea totam voluptatem non consequatur at excepturi sint. Voluptates aliquam suscipit exercitationem assumenda laboriosam, tempore dicta? Rerum, pariatur?</p>

</html>
